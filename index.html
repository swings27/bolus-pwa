<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bolus-icone-192.png" />
    <!-- Favicon vectoriel : les navigateurs qui savent l'afficher (la
         quasi-totalité aujourd'hui) le préfèrent au PNG ci-dessus, qui reste
         le repli pour les autres — les deux liens peuvent coexister. -->
    <link rel="icon" type="image/svg+xml" href="/bolus-favicon.svg" />
    <!-- iOS ignore totalement le manifest PWA pour l'icône d'écran
         d'accueil : il lui faut ce lien explicite, vers une image carrée de
         180x180 exactement, pour afficher l'icône Bolus au lieu d'une
         capture de la page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Ouvre l'application en plein écran sur iOS (sans la barre d'adresse
         Safari) une fois ajoutée à l'écran d'accueil — sans cette balise,
         l'installation ouvrirait un simple onglet Safari et l'intérêt de la
         PWA disparaîtrait. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bolus" />
    <!-- viewport-fit=cover : sans ça, env(safe-area-inset-*) reste figé à 0
         sur iOS même sur un iPhone à encoche/île dynamique — la barre de
         navigation passerait sous l'indicateur de geste. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C65D3B" />
    <title>Bolus — Fiches médicaments et calculateurs pour infirmiers</title>
    <!-- TEMPORAIRE — bêta-test. À SUPPRIMER au lancement public -->
    <meta name="robots" content="noindex, nofollow">
    <meta
      name="description"
      content="L'information médicamenteuse fiable et à portée de main. Fiches sourcées RCP ANSM, calculateurs de débit et de dose. Gratuit, sans compte."
    />

    <!-- Open Graph / Twitter Card : sans ces balises, un lien Bolus partagé
         par message ou dans un groupe professionnel s'affiche nu — pour une
         application médicale envoyée à des inconnus, ça ressemble à du spam
         et personne ne clique. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bolus" />
    <meta property="og:title" content="Bolus — Fiches médicaments pour infirmiers" />
    <meta
      property="og:description"
      content="Fiches sourcées RCP ANSM, calculateurs de débit et de dose. Gratuit, sans compte."
    />
    <!-- TODO : remplacer par le domaine réel une fois l'URL Vercel de la
         bêta connue. -->
    <meta property="og:image" content="https://[domaine-beta]/og-image.png" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Anti-flash de thème : s'exécute AVANT que React (et Dexie) ne
         démarre, pour poser la classe "dark" sur <html> dès le tout premier
         paint. Sans ça, la page s'afficherait toujours en clair une
         fraction de seconde avant que React ne monte et ne corrige — un
         flash désagréable et carrément gênant en pleine garde de nuit.
         Problème : la préférence de thème vit dans Dexie (IndexedDB), qui
         est asynchrone — impossible à lire depuis un script inline
         synchrone comme celui-ci sans bloquer le rendu en attendant une
         Promise. Solution : ThemeContext.tsx duplique la préférence dans
         localStorage (lui est synchrone) à chaque changement de thème.
         Dexie reste la source de vérité pour le reste de l'app ;
         localStorage n'est qu'un cache de démarrage lu une seule fois, ici. -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme')
        var sombre =
          theme === 'sombre' ||
          ((theme === 'auto' || !theme) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (sombre) document.documentElement.classList.add('dark')
      })()
    </script>

    <!-- Dynamic Type iOS. Toutes les tailles de texte de l'app sont en rem,
         donc elles suivent la taille de police par défaut du navigateur —
         ce qui marche sur Android et sur les navigateurs de bureau, mais PAS
         sur iOS : Safari ne répercute pas le réglage « Taille du texte » de
         l'iPhone sur la racine. Il faut le lui demander explicitement, et
         la seule façon de lire ce réglage est la valeur système
         "-apple-system-body".

         On la lit sur <html> puis on la remplace aussitôt par une taille en
         pixels calculée, plutôt que de laisser "font: -apple-system-body"
         en place : ce raccourci écraserait aussi la police, la graisse et
         l'interlignage de la racine.

         Le calcul fait deux choses :
         — 16 x taille/17 : 17px est le corps système au réglage PAR DÉFAUT
           d'iOS. Quelqu'un qui n'a jamais touché ce réglage retrouve donc
           exactement les 16px d'aujourd'hui, l'app ne change pas d'aspect
           sous ses yeux ; seuls ceux qui ont demandé un texte plus grand
           en voient un.
         — bornes 16 à 22px : mesuré route par route sur un écran de 390px,
           la mise en page tient jusqu'à 22px (x1,38). À 24px la tuile de
           catégorie déborde de l'écran, à 26px c'est l'onglet Favoris de la
           barre du bas. Sans plafond, les crans d'accessibilité iOS montent
           jusqu'à 53px et casseraient tout. Le plancher à 16px empêche
           l'inverse : macOS renvoie 13px pour cette même valeur système, et
           l'app y rapetisserait sans raison.

         Le garde CSS.supports est indispensable : ailleurs que sur les
         plateformes Apple, la sonde renverrait la taille par défaut du
         navigateur et on écraserait le réglage de l'utilisateur avec 16px,
         annulant précisément le bénéfice des rem. -->
    <script>
      (function () {
        if (!window.CSS || !CSS.supports('font', '-apple-system-body')) return
        try {
          var racine = document.documentElement
          racine.style.font = '-apple-system-body'
          var corps = parseFloat(getComputedStyle(racine).fontSize)
          racine.style.font = ''
          if (corps > 0) {
            racine.style.fontSize = Math.min(Math.max((16 * corps) / 17, 16), 22) + 'px'
          }
        } catch (erreur) {
          /* Réglage d'agrément : en cas d'échec, on reste sur les 16px par
             défaut plutôt que de risquer un écran blanc au démarrage. */
        }
      })()
    </script>

    <!-- preconnect accélère la négociation TLS avec les domaines Google
         Fonts avant même que le CSS des polices ne soit demandé. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (variable, on ne garde que le poids 600 utile aux titres)
         et Nunito Sans (400 texte courant, 600 emphase) pour l'interface. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
